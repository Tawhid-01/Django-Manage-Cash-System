<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Book Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4 shadow">


                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger py-2 text-center" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <h2 class="text-center">{{title}}</h2>

                <form method="POST">
                    {% csrf_token %}
                    
                   {{form.as_p}}


                    <button type="submit" class="btn btn-info w-100 fw-bold mt-2">{{btn}}</button>
                </form>

                <p class="text-center mt-3 text-secondary small">
                    Don't have any account? <a href="{% url 'register' %}" class="text-info text-decoration-none">Register</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
